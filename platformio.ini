; ============================================================
; PlatformIO конфигурация — Портальная пушка Рика Санчеза
; MCU: STM32F103C8T6 (Blue Pill)
; Framework: Arduino (STM32duino)
; ============================================================

[env:bluepill_f103c8]
platform  = ststm32
board     = bluepill_f103c8
framework = arduino

; Загрузчик через ST-Link v2
upload_protocol = stlink
debug_tool      = stlink

; Скорость монитора (для отладки через Serial)
monitor_speed = 115200

; Флаги компилятора
build_flags =
    -D ARDUINO_ARCH_STM32
    -D STM32F1xx
    ; HAL_TIM_MODULE_ENABLED и HAL_ADC_MODULE_ENABLED включаются автоматически фреймворком
    ; Оптимизация по размеру (важно для 64кБ Flash)
    -Os
    -std=c++14

; Зависимости: NeoPixel
; Используем Adafruit NeoPixel — совместима с STM32duino
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0

; Игнорировать лишние предупреждения
build_unflags =
    -Werror
